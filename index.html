<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markorð 151 - 160 algengustu orðin 💻 🎧</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }

        .lang-selector {
            margin-bottom: 20px;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ffcc80;
        }

        .lang-selector select {
            padding: 8px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
            max-width: 300px;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.1em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.6; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 70%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Markorð 151 - 160 algengustu orðin 💻 🎧</h1>

        <div id="progress-bar"></div>
    </div>

    <div id="counter"></div>

    <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>

    <div id="media-box"><i>Veldu tungumál úr listanum að ofan til að sjá þýðingu.</i></div>

    <div class="nav-btns">
        <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
    </div>

    <div class="feedback-note">
        Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
    </div>
</div>

<script>
const exerciseData = [
    { 
        text: "þessu", 
        is_exp: "<b>Útskýring:</b> (Ábendingarfornafn) Vísar á eitthvað ákveðið í þágufalli (hvorugkyn eða eftir forsetningum).<br><br><b>Dæmi:</b> Við verðum að breyta <b>þessu</b>.",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (اسم إشارة) يشير إلى شيء محدد في حالة الجر (هذا).<br><b>مثال:</b> يجب علينا أن نغير <b>هذا</b>.</div>",
            "be": "<b>Uitleg:</b> (Aanwijzend voornaamwoord) Wijst naar iets specifieks in de datief (dit).<br><b>Voorbeeld:</b> We moeten <b>dit</b> veranderen.",
            "da": "<b>Forklaring:</b> (Påpegende stedord) Henviser til noget bestemt i dativ (dette).<br><b>Eksempel:</b> Vi bliver nødt til at ændre <b>dette</b>.",
            "en": "<b>Explanation:</b> (Demonstrative pronoun) Points to something specific in the dative case (this).<br><b>Example:</b> We have to change <b>this</b>.",
            "tl": "<b>Paliwanag:</b> (Panghalip pamatlig) Tumutukoy sa isang partikular na bagay sa dative case (ito).<br><b>Halimbawa:</b> Kailangan nating baguhin <b>ito</b>.",
            "fi": "<b>Selitys:</b> (Osoittava pronomini) Viittaa tiettyyn asiaan datiivissa (tämä/tähän).<br><b>Esimerkki:</b> Meidän täytyy muuttaa <b>tätä</b>.",
            "fr": "<b>Explication:</b> (Pronom démonstratif) Désigne une chose spécifique au datif (ceci/ça).<br><b>Exemple:</b> Nous devons changer <b>ceci (ça)</b>.",
            "fo": "<b>Frágreiðing:</b> (Ávísingarfornavn) Vísir á okkurt ávíst í hvørjumfalli (hesum).<br><b>Dømi:</b> Vit mugu broyta <b>hesum (þessu)</b>.",
            "kl": "<b>Nassoqqaat:</b> (Fornavn) Una/matumani.<br><b>Assersuut:</b> <b>Una</b> allanngortittariaqarparput.",
            "nl": "<b>Uitleg:</b> (Aanwijzend voornaamwoord) Wijst naar iets specifieks in de datief (dit).<br><b>Voorbeeld:</b> We moeten <b>dit</b> veranderen.",
            "it": "<b>Spiegazione:</b> (Pronome dimostrativo) Indica qualcosa di specifico al dativo (questo/ciò).<br><b>Esempio:</b> Dobbiamo cambiare <b>questo</b>.",
            "ja": "<b>説明:</b> (指示代名詞) 与格で特定のものを指します（これ）。<br><b>例文:</b> 私たちは<b>これ</b>を変えなければなりません。",
            "zh": "<b>解释:</b> (指示代词) 在与格中指向特定的事物（这/这个）。<br><b>例句:</b> 我们必须改变<b>这个</b>。",
            "ku": "<b>Ravekirin:</b> (Cînavê nîşander) Di datîvê de tiştekî taybet nîşan dide (ev).<br><b>Mînak:</b> Divê em <b>vê</b> biguherînin.",
            "lv": "<b>Paskaidrojums:</b> (Norādāmais vietniekvārds) Norāda uz kaut ko konkrētu datīvā (šo/to).<br><b>Piemērs:</b> Mums <b>to (šo)</b> ir jāmaina.",
            "lt": "<b>Paaiškinimas:</b> (Parodomasis įvardis) Nurodo kažką konkretaus naudininke (šiam/tai).<br><b>Pavyzdys:</b> Mes turime pakeisti <b>tai</b>.",
            "no": "<b>Forklaring:</b> (Påpekende pronomen) Viser til noe bestemt i dativ (dette).<br><b>Eksempel:</b> Vi må endre på <b>dette</b>.",
            "fa": "<div dir='rtl'><b>توضیح:</b> (ضمیر اشاره) به چیز خاصی در حالت مفعولی با واسطه اشاره می‌کند (این).<br><b>مثال:</b> ما باید <b>این</b> را تغییر دهیم.</div>",
            "pt": "<b>Explicação:</b> (Pronome demonstrativo) Aponta para algo específico no caso dativo (isto/isso).<br><b>Exemplo:</b> Nós temos que mudar <b>isto</b>.",
            "pl": "<b>Wyjaśnienie:</b> (Zaimek wskazujący) Wskazuje na coś konkretnego w celowniku (to).<br><b>Przykład:</b> Musimy <b>to</b> zmienić.",
            "ro": "<b>Explicație:</b> (Pronume demonstrativ) Indică un lucru specific în cazul dativ (acest lucru/asta).<br><b>Exemplu:</b> Trebuie să schimbăm <b>asta</b>.",
            "ru": "<b>Объяснение:</b> (Указательное местоимение) Указывает на что-то конкретное в дательном падеже (это).<br><b>Пример:</b> Мы должны изменить <b>это</b>.",
            "es": "<b>Explicación:</b> (Pronombre demostrativo) Señala algo específico en caso dativo (esto/eso).<br><b>Ejemplo:</b> Tenemos que cambiar <b>esto</b>.",
            "sv": "<b>Förklaring:</b> (Demonstrativt pronomen) Pekar på något specifikt i dativ (detta).<br><b>Exempel:</b> Vi måste ändra på <b>detta</b>.",
            "th": "<b>คำอธิบาย:</b> (สรรพนามชี้เฉพาะ) ชี้ไปยังสิ่งที่เฉพาะเจาะจงในรูปรองกรรม (สิ่งนี้)<br><b>ตัวอย่าง:</b> พวกเราต้องเปลี่ยน<b>สิ่งนี้</b>",
            "de": "<b>Erklärung:</b> (Demonstrativpronomen) Weist auf etwas Bestimmtes im Dativ hin (dies/das).<br><b>Beispiel:</b> Wir müssen <b>dies (das)</b> ändern.",
            "uk": "<b>Пояснення:</b> (Вказівний займенник) Вказує на щось конкретне в давальному відмінку (це).<br><b>Приклад:</b> Ми повинні змінити <b>це</b>.",
            "vi": "<b>Giải thích:</b> (Đại từ chỉ định) Chỉ một điều cụ thể ở cách tặng (điều này/cái này).<br><b>Ví dụ:</b> Chúng ta phải thay đổi <b>điều này</b>."
        }
    },
    { 
        text: "annars", 
        is_exp: "<b>Útskýring:</b><br>1. (Tengiorð) Þýðir 'ella' (ef ekki).<br>2. (Atviksorð) Notað til að skipta um umræðuefni ('við the veg' eða 'hvað er að frétta?').<br><b>Samheiti:</b> ella.<br><br><b>Dæmi 1:</b> Flýttu þér, <b>annars</b> verðurðu of seinn.<br><b>Dæmi 2:</b> Hvað er <b>annars</b> að frétta?",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b><br>1. (حرف عطف) يعني 'وإلا' (إذا لم يكن كذلك).<br>2. (ظرف) يُستخدم لتغيير الموضوع ('على فكرة').<br><b>مثال 1:</b> أسرع، <b>وإلا</b> ستتأخر.<br><b>مثال 2:</b> ما الأخبار <b>بالمناسبة (على فكرة)</b>؟</div>",
            "be": "<b>Uitleg:</b><br>1. (Voegwoord) Betekent 'anders' (als niet).<br>2. (Bijwoord) Gebruikt om van onderwerp te veranderen ('trouwens').<br><b>Voorbeeld 1:</b> Haast je, <b>anders</b> ben je te laat.<br><b>Voorbeeld 2:</b> Wat is er <b>trouwens</b> voor nieuws?",
            "da": "<b>Forklaring:</b><br>1. (Bindeord) Betyder 'ellers'.<br>2. (Biord) Bruges til at skifte emne ('forresten').<br><b>Eksempel 1:</b> Skynd dig, <b>ellers</b> kommer du for sent.<br><b>Eksempel 2:</b> Hvad er der <b>ellers</b> af nyt?",
            "en": "<b>Explanation:</b><br>1. (Conjunction) Means 'otherwise' (if not).<br>2. (Adverb) Used to change the subject ('by the way').<br><b>Example 1:</b> Hurry up, <b>otherwise</b> you will be late.<br><b>Example 2:</b> What's new, <b>by the way</b>?",
            "tl": "<b>Paliwanag:</b><br>1. (Pangatnig) Nangangahulugang 'kung hindi' (otherwise).<br>2. (Pang-abay) Ginagamit para ibahin ang usapan ('siyanga pala').<br><b>Halimbawa 1:</b> Magmadali ka, <b>kung hindi</b> mahuhuli ka.<br><b>Halimbawa 2:</b> Ano ang balita, <b>siyanga pala</b>?",
            "fi": "<b>Selitys:</b><br>1. (Konjunktio) Tarkoittaa 'muuten' (jos ei).<br>2. (Adverbi) Käytetään aiheen vaihtamiseen ('muuten').<br><b>Esimerkki 1:</b> Pidä kiirettä, <b>muuten</b> myöhästyt.<br><b>Esimerkki 2:</b> Mitä <b>muuten</b> kuuluu?",
            "fr": "<b>Explication:</b><br>1. (Conjonction) Signifie 'sinon' (si non).<br>2. (Adverbe) Utilisé pour changer de sujet ('au fait').<br><b>Exemple 1:</b> Dépêche-toi, <b>sinon</b> tu seras en retard.<br><b>Exemple 2:</b> Quoi de neuf, <b>au fait</b> ?",
            "fo": "<b>Frágreiðing:</b><br>1. (Sambindingarorð) Merkir 'ella' (annars).<br>2. (Hjáorð) Brúkt til at skifta evni ('viðvíkjandi tí').<br><b>Dømi 1:</b> Skunda tær, <b>annars</b> verður tú ov seinur.<br><b>Dømi 2:</b> Hvat er <b>annars</b> at frætta?",
            "kl": "<b>Nassoqqaat:</b><br>1. (Bindingsord) Taamaanngippat.<br>2. (Oqaaseeraq) Tassami.<br><b>Assersuut 1:</b> Nukigit, <b>taamaanngippat</b> kingusissootit.<br><b>Assersuut 2:</b> <b>Tassami</b> qanoq ippit?",
            "nl": "<b>Uitleg:</b><br>1. (Voegwoord) Betekent 'anders' (als niet).<br>2. (Bijwoord) Gebruikt om van onderwerp te veranderen ('trouwens').<br><b>Voorbeeld 1:</b> Haast je, <b>anders</b> ben je te laat.<br><b>Voorbeeld 2:</b> Wat is er <b>trouwens</b> voor nieuws?",
            "it": "<b>Spiegazione:</b><br>1. (Congiunzione) Significa 'altrimenti' (se no).<br>2. (Avverbio) Usato per cambiare argomento ('a proposito').<br><b>Esempio 1:</b> Sbrigati, <b>altrimenti</b> farai tardi.<br><b>Esempio 2:</b> Che c'è di nuovo, <b>a proposito</b>?",
            "ja": "<b>説明:</b><br>1. (接続詞) 「さもないと」（もしそうでなければ）を意味します。<br>2. (副詞) 話題を変えるために使われます（「ところで」）。<br><b>例文 1:</b> 急いで、<b>さもないと</b>遅れるよ。<br><b>例文 2:</b> <b>ところで</b>、何か新しいニュースはある？",
            "zh": "<b>解释:</b><br>1. (连词) 意思是“否则”（如果不）。<br>2. (副词) 用于转换话题（“顺便问一下”）。<br><b>例句 1:</b> 快点，<b>否则</b>你会迟到的。<br><b>例句 2:</b> <b>顺便问一下</b>，有什么新鲜事？",
            "ku": "<b>Ravekirin:</b><br>1. (Gihênek) Tê wateya 'an na' (heger na).<br>2. (Hoker) Ji bo guhertina mijarê tê bikaranîn ('bi rastî jî').<br><b>Mînak 1:</b> Lez bike, <b>an na</b> tu yê dereng bimînî.<br><b>Mînak 2:</b> <b>Bi rastî jî</b>, çi nûçe hene?",
            "lv": "<b>Paskaidrojums:</b><br>1. (Saiklis) Nozīmē 'citādi' (ja nē).<br>2. (Apstākļa vārds) Lieto tēmas maiņai ('starp citu').<br><b>Piemērs 1:</b> Pasteidzies, <b>citādi</b> tu nokavēsi.<br><b>Piemērs 2:</b> Kas jauns, <b>starp citu</b>?",
            "lt": "<b>Paaiškinimas:</b><br>1. (Jungtukas) Reiškia 'kitaip' (jei ne).<br>2. (Prievezmis) Naudojamas keičiant temą ('tarp kitko').<br><b>Pavyzdys 1:</b> Paskubėk, <b>kitaip</b> pavėluosi.<br><b>Pavyzdys 2:</b> Kas naujo, <b>tarp kitko</b>?",
            "no": "<b>Forklaring:</b><br>1. (Konjunksjon) Betyr 'ellers' (hvis ikke).<br>2. (Adverb) Brukes for å bytte emne ('forresten').<br><b>Eksempel 1:</b> Skynd deg, <b>ellers</b> blir du for sen.<br><b>Eksempel 2:</b> Hva er det <b>ellers</b> av nytt?",
            "fa": "<div dir='rtl'><b>توضیح:</b><br>1. (حرف ربط) به معنی 'وگرنه' (اگر نه).<br>2. (قید) برای تغییر موضوع استفاده می‌شود ('راستی').<br><b>مثال 1:</b> عجله کن، <b>وگرنه</b> دیر می‌رسی.<br><b>مثال 2:</b> <b>راستی</b> چه خبر؟</div>",
            "pt": "<b>Explicação:</b><br>1. (Conjunção) Significa 'caso contrário' (senão).<br>2. (Advérbio) Usado para mudar de assunto ('a propósito').<br><b>Exemplo 1:</b> Apresse-se, <b>caso contrário (senão)</b> você vai se atrasar.<br><b>Exemplo 2:</b> O que há de novo, <b>a propósito</b>?",
            "pl": "<b>Wyjaśnienie:</b><br>1. (Spójnik) Oznacza 'w przeciwnym razie' (inaczej).<br>2. (Przysłówek) Używany do zmiany tematu ('przy okazji').<br><b>Przykład 1:</b> Pospiesz się, <b>inaczej</b> się spóźnisz.<br><b>Przykład 2:</b> Co tam <b>poza tym (przy okazji)</b> słychać?",
            "ro": "<b>Explicație:</b><br>1. (Conjuncție) Înseamnă 'altfel' (dacă nu).<br>2. (Adverb) Folosit pentru a schimba subiectul ('apropo').<br><b>Exemplu 1:</b> Grăbește-te, <b>altfel</b> vei întârzia.<br><b>Exemplu 2:</b> Ce mai e nou, <b>apropo</b>?",
            "ru": "<b>Объяснение:</b><br>1. (Союз) Означает 'иначе' (если не).<br>2. (Наречие) Используется для смены темы ('кстати').<br><b>Пример 1:</b> Поторопись, <b>иначе</b> опоздаешь.<br><b>Пример 2:</b> Что нового, <b>кстати</b>?",

            "fr": "<b>Explication:</b> (Pronom personnel) Désigne la personne qui parle (je) à l'accusatif (moi/me).<br><b>Exemple 1:</b> Il ne <b>m'</b>a pas vu.<br><b>Exemple 2:</b> <b>Je</b> (me) veux rentrer à la maison.",

            "lv": "<b>Paskaidrojums:</b> (Personas vietniekvārds) Norāda uz runātāju (es) akuzatīvā (mani).<br><b>Piemērs 1:</b> Viņš <b>mani</b> neredzēja.<br><b>Piemērs 2:</b> <b>Man</b> gribas iet mājās.",
            "lt": "<b>Paaiškinimas:</b> (Asmeninis įvardis) Nurodo kalbėtoją (aš) galininke (mane).<br><b>Pavyzdys 1:</b> Jis nematė <b>manęs</b>.<br><b>Pavyzdys 2:</b> <b>Aš</b> noriu eiti namo.",
            "no": "<b>Forklaring:</b> (Personlig pronomen) Refererer til den som snakker (jeg) i akkusativ (meg).<br><b>Eksempel:</b> Han så <b>meg</b> ikke.<br><b>Eksempel 2:</b> <b>Jeg</b> har lyst til å dra hjem.",
            "fa": "<div dir='rtl'><b>توضیح:</b> (ضمیر شخصی) به گوینده (من) در حالت مفعولی اشاره دارد (مرا).<br><b>مثال 1:</b> او <b>مرا</b> ندید.<br><b>مثال 2:</b> <b>من</b> دلم می‌خواهد به خانه بروم.</div>",
            "pt": "<b>Explicação:</b> (Pronome pessoal) Refere-se a quem fala (eu) no caso acusativo (me/mim).<br><b>Exemplo 1:</b> Ele não <b>me</b> viu.<br><b>Exemplo 2:</b> <b>Eu</b> quero ir para casa.",
            "pl": "<b>Wyjaśnienie:</b> (Zaimek osobowy) Odnosi się do mówiącego (ja) w bierniku (mnie).<br><b>Przykład 1:</b> On <b>mnie</b> nie widział.<br><b>Przykład 2:</b> <b>Ja</b> chcę iść do domu.",
            "ro": "<b>Explicație:</b> (Pronume personal) Se referă la vorbitor (eu) în cazul acuzativ (pe mine/mă).<br><b>Exemplu 1:</b> El nu <b>m-</b>a văzut.<br><b>Exemplu 2:</b> <b>Eu</b> vreau să merg acasă.",

            "es": "<b>Explicación:</b> (Pronombre personal) Se refiere al hablante (yo) en caso acusativo (me / a mí).<br><b>Ejemplo 1:</b> Él no <b>me</b> vio.<br><b>Ejemplo 2:</b> <b>Yo</b> quiero ir a casa.",

            "th": "<b>คำอธิบาย:</b> (บุรุษสรรพนาม) อ้างถึงผู้พูด (ฉัน) ในรูปกรรม (ฉัน)<br><b>ตัวอย่าง 1:</b> เขาไม่เห็น<b>ฉัน</b><br><b>ตัวอย่าง 2:</b> <b>ฉัน</b>อยากกลับบ้าน",
            "de": "<b>Erklärung:</b> (Personalpronomen) Bezieht sich auf den Sprecher (ich) im Akkusativ (mich).<br><b>Beispiel 1:</b> Er hat <b>mich</b> nicht gesehen.<br><b>Beispiel 2:</b> <b>Ich</b> möchte nach Hause gehen.",
